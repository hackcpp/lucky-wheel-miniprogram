<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>幸运转盘 · 原型预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Helvetica,sans-serif;
       background:#e9ebf0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
  .phone{width:390px;background:#f7f8fa;border-radius:42px;overflow:hidden;
         box-shadow:0 22px 60px rgba(0,0,0,.20);position:relative;border:1px solid #d6d9e0;}
  .statusbar{height:44px;background:#f7f8fa;display:flex;justify-content:space-between;align-items:center;
             padding:0 26px;font-size:14px;color:#333;font-weight:600;}
  .statusbar .icons{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:400;}
  .navbar{height:46px;background:#f7f8fa;display:flex;justify-content:center;align-items:center;position:relative;
          font-size:17px;font-weight:600;color:#333;border-bottom:1px solid #ececec;}
  .navbar .capsule{position:absolute;right:12px;top:9px;width:87px;height:30px;background:#fff;border-radius:15px;
                   display:flex;align-items:center;justify-content:space-around;font-size:12px;color:#333;
                   box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  .screen{height:664px;overflow-y:auto;position:relative;background:linear-gradient(165deg,#f0faf4 0%,#e6f4ec 100%);}
  .hidden{display:none!important;}

  /* 分类 Tab */
  .tabs{display:flex;gap:8px;justify-content:center;padding:20px 0 6px;}
  .tab{padding:8px 20px;border-radius:24px;border:1px solid #07c160;color:#07c160;font-size:15px;background:transparent;cursor:pointer;transition:.2s;}
  .tab.active{background:#07c160;color:#fff;}

  /* 转盘 */
  .wheel-wrap{position:relative;width:300px;height:300px;margin:26px auto 0;}
  #wheel{display:block;}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
           width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
           border-top:28px solid #0a8f4f;z-index:3;filter:drop-shadow(0 2px 3px rgba(10,143,79,.30));}
  .spin-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:86px;height:86px;border-radius:50%;background:#07c160;color:#fff;border:none;
            font-size:19px;font-weight:600;box-shadow:0 8px 18px rgba(7,193,96,.42);z-index:4;cursor:pointer;}
  .spin-btn:disabled{opacity:.55;}

  .hint{text-align:center;color:#999;font-size:13px;margin-top:22px;padding:0 34px;line-height:1.7;}
  .manage-entry{display:block;width:210px;margin:26px auto 0;text-align:center;color:#07c160;font-size:15px;
                padding:12px;border:1px solid #07c160;border-radius:24px;cursor:pointer;transition:opacity .2s;}
  .manage-entry.disabled{opacity:.4;pointer-events:none;}

  /* 结果卡片 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;justify-content:center;align-items:center;z-index:10;}
  .card{width:282px;background:#fff;border-radius:24px;padding:30px 24px;text-align:center;animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .card .label{color:#999;font-size:14px;}
  .card .result{color:#333;font-size:30px;font-weight:700;margin:12px 0 8px;}
  .card .weight{color:#07c160;font-size:14px;margin-bottom:22px;}
  .card .btns{display:flex;gap:12px;}
  .card .btns button{flex:1;padding:12px;border:none;border-radius:24px;font-size:15px;cursor:pointer;}
  .btn-primary{background:#07c160;color:#fff;}
  .btn-ghost{background:#f2f3f5;color:#333;}

  /* 管理页 */
  .mg-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #ececec;}
  .mg-back{font-size:15px;color:#07c160;cursor:pointer;}
  .mg-title{margin:0 auto;font-size:17px;font-weight:600;}
  .mg-list{padding:8px 16px;min-height:420px;}
  .mg-item{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;
           padding:12px 14px;margin-bottom:10px;}
  .mg-item .name{font-size:16px;color:#333;}
  .mg-item .ctrl{display:flex;align-items:center;gap:8px;}
  .mg-item .w{color:#07c160;font-size:13px;min-width:30px;text-align:center;}
  .mg-item button{width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px;color:#333;cursor:pointer;}
  .mg-item .del{color:#999;border-color:#eee;font-size:13px;width:auto;padding:0 12px;height:28px;border-radius:14px;}
  .mg-add{display:flex;gap:8px;padding:12px 16px;position:sticky;bottom:0;background:rgba(255,255,255,.9);border-top:1px solid #e4eee9;}
  .mg-add input{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 14px;font-size:15px;background:#fff;outline:none;}
  .mg-add select{border:1px solid #ddd;border-radius:20px;padding:0 6px;background:#fff;outline:none;}
  .mg-add .add{background:#07c160;color:#fff;border:none;border-radius:20px;padding:0 18px;font-size:15px;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● 5G ▱ 100%</span></div>
  <div class="navbar">幸运转盘<span class="capsule">◐ ⊙</span></div>
  <div class="screen">
    <!-- 首页 -->
    <div id="home">
      <div class="tabs">
        <div class="tab active" data-cat="eat">吃什么</div>
        <div class="tab" data-cat="play">玩什么</div>
        <div class="tab" data-cat="custom">自定义</div>
      </div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <button class="spin-btn" id="spinBtn">开始</button>
      </div>
      <div class="manage-entry" id="toManage">管理选项</div>
    </div>

    <!-- 管理页 -->
    <div id="manage" class="hidden">
      <div class="mg-head"><span class="mg-back" id="backHome">‹ 返回</span><span class="mg-title">管理选项</span></div>
      <div class="tabs">
        <div class="tab active" data-mcat="eat">吃什么</div>
        <div class="tab" data-mcat="play">玩什么</div>
        <div class="tab" data-mcat="custom">自定义</div>
      </div>
      <div class="mg-list" id="mgList"></div>
      <div class="mg-add">
        <input id="newName" placeholder="输入选项">
        <select id="newWeight">
          <option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option><option value="5">×5</option>
        </select>
        <button class="add" id="addBtn">添加</button>
      </div>
    </div>

    <!-- 结果浮层 -->
    <div class="mask hidden" id="mask">
      <div class="card">
        <div class="label">今天就决定</div>
        <div class="result" id="resText">火锅</div>
        <div class="btns">
          <button class="btn-ghost" id="againBtn">再转一次</button>
          <button class="btn-primary" id="okBtn">就它了</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULTS = {
  eat:  { name:'吃什么', items:[{text:'火锅',weight:1},{text:'烧烤',weight:3},{text:'日料',weight:1},{text:'快餐',weight:1},{text:'沙拉',weight:1},{text:'家常菜',weight:1},{text:'麻辣烫',weight:1},{text:'寿司',weight:1},{text:'披萨',weight:1},{text:'粥铺',weight:1}] },
  play: { name:'玩什么', items:[{text:'看电影',weight:1},{text:'打游戏',weight:1},{text:'逛街',weight:1},{text:'运动',weight:1},{text:'在家躺',weight:1},{text:'读书',weight:1},{text:'看剧',weight:1},{text:'约朋友',weight:1},{text:'旅行',weight:1},{text:'看展',weight:1}] },
  custom: { name:'自定义', items:[{text:'下楼走走',weight:1},{text:'刷会视频',weight:1},{text:'发会呆',weight:1},{text:'随便逛逛',weight:1},{text:'学点新东西',weight:1}] }
};
function load(){
  const base = JSON.parse(JSON.stringify(DEFAULTS)); // 以当前版本结构为基准，保证新分类(如 custom)始终存在
  try{
    const s = localStorage.getItem('wheel_categories');
    if(s){
      const stored = JSON.parse(s);
      if(stored && typeof stored === 'object'){
        for(const k of Object.keys(base)){
          if(stored[k] && Array.isArray(stored[k].items)) base[k] = stored[k];
        }
      }
    }
  }catch(e){}
  return base;
}
function save(d){ localStorage.setItem('wheel_categories', JSON.stringify(d)); }

let data = load();
let cur = 'eat';

function currentItems(){
  return data[cur].items;
}

/* ---------- 转盘绘制 ---------- */
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
const SIZE = 300;
canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px';
canvas.width = SIZE*dpr; canvas.height = SIZE*dpr;
let rotation = -Math.PI/2;

// 转盘扇区配色（单色系明度梯度）——遵循 Anti-Slop 配色纪律：
// 锁定单一绿 family 为全页唯一强调色；低饱和（<80%）；同 hue 的明度阶梯
// 相邻明度差恒定可见、首尾明度差最大 → 扇区可区分、奇数也不撞色
// 注意：微信小程序真机 canvas 2d 对 hsl() 支持不全，会解析错乱，
// 因此这里统一用 hex，保证原型与小程序、浏览器与真机视觉完全一致。
function hslToHex(h, s, l) {
  s = Number(s) / 100; l = Number(l) / 100;
  const a = s * Math.min(l, 1 - l);
  const k = (n) => (n + h / 30) % 12;
  const f = (n) => {
    const c = l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
function wheelSectorColors(n){
  const H = 150, S = 46;          // 清新绿系，低饱和
  const Lmax = 92, Lmin = 60;     // 明度从浅到深
  if(n <= 1) return [hslToHex(H, S, Lmax)];
  const out = [];
  for(let i=0;i<n;i++){
    const L = Lmax - (Lmax - Lmin) * i / (n - 1);
    out.push(hslToHex(H, S, L.toFixed(1)));
  }
  return out;
}

function drawWheel(rot, items){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(dpr,dpr);
  const r = SIZE/2 - 6;
  const n = items.length;
  const seg = 2*Math.PI/n;
  const colors = wheelSectorColors(n);
  for(let i=0;i<n;i++){
    const start = rot + i*seg;
    const end = start + seg;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,start,end); ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.save();
    ctx.rotate(start + seg/2);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#333'; ctx.font = '14px PingFang SC, sans-serif';
    let label = items[i].text;
    if(label.length > 5) label = label.slice(0,5)+'…';
    ctx.fillText(label, r-14, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0,0,r,0,2*Math.PI);
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
}
drawWheel(rotation, currentItems());

/* ---------- 分类切换 ---------- */
document.querySelectorAll('#home .tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('#home .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    cur = t.dataset.cat;
    rotation = -Math.PI/2;
    drawWheel(rotation, currentItems());
  });
});

/* ---------- 旋转 ---------- */
let spinning = false;
const spinBtn = document.getElementById('spinBtn');

function weightedPick(items){
  const total = items.reduce((s,it)=>s+it.weight, 0);
  let r = Math.random()*total;
  for(let i=0;i<items.length;i++){ r -= items[i].weight; if(r<0) return i; }
  return items.length-1;
}
function spin(){
  if(spinning) return;
  const items = currentItems();
  if(items.length === 0){ alert('请先去管理页添加选项'); return; }
  spinning = true; spinBtn.disabled = true; document.getElementById('toManage').classList.add('disabled');
  const n = items.length, seg = 2*Math.PI/n;
  const target = weightedPick(items);
  const center = target*seg + seg/2;
  // 目标：rotation + center ≡ -π/2 (mod 2π)，并叠加 5 圈
  const rel = (((-Math.PI/2 - center) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const startRot = rotation;
  let desired = startRot - (startRot % (2*Math.PI)) + rel + 5*2*Math.PI;
  if(desired <= startRot) desired += 2*Math.PI;
  const delta = desired - startRot;
  const duration = 3500, t0 = performance.now();
  function frame(now){
    let t = (now - t0)/duration; if(t>1) t=1;
    const eased = 1 - Math.pow(1-t, 3);
    rotation = startRot + delta*eased;
    drawWheel(rotation, items);
    if(t < 1) requestAnimationFrame(frame);
    else { spinning = false; spinBtn.disabled = false; document.getElementById('toManage').classList.remove('disabled'); showResult(items[target]); }
  }
  requestAnimationFrame(frame);
}
spinBtn.addEventListener('click', spin);

/* ---------- 结果卡片 ---------- */
const mask = document.getElementById('mask');
function showResult(it){
  document.getElementById('resText').textContent = it.text;
  mask.classList.remove('hidden');
}
document.getElementById('okBtn').addEventListener('click', ()=>mask.classList.add('hidden'));
document.getElementById('againBtn').addEventListener('click', ()=>{ mask.classList.add('hidden'); spin(); });

/* ---------- 管理页 ---------- */
document.getElementById('toManage').addEventListener('click', ()=>{ if(spinning) return;
  cur2 = cur;
  document.querySelectorAll('#manage .tab').forEach(x=>x.classList.toggle('active', x.dataset.mcat === cur2));
  document.getElementById('home').classList.add('hidden');
  document.getElementById('manage').classList.remove('hidden');
  renderManage();
});
document.getElementById('backHome').addEventListener('click', ()=>{
  cur = cur2;
  document.querySelectorAll('#home .tab').forEach(x=>x.classList.toggle('active', x.dataset.cat === cur));
  rotation = -Math.PI/2;
  document.getElementById('manage').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  drawWheel(rotation, currentItems());
});
let cur2 = 'eat';
document.querySelectorAll('#manage .tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('#manage .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    cur2 = t.dataset.mcat;
    renderManage();
  });
});
function renderManage(){
  const list = data[cur2].items;
  const el = document.getElementById('mgList'); el.innerHTML = '';
  list.forEach((it, idx)=>{
    const div = document.createElement('div'); div.className = 'mg-item';
    div.innerHTML = `<span class="name">${it.text}</span>`+
      `<span class="ctrl"><button data-act="dec" data-i="${idx}">−</button>`+
      `<span class="w">×${it.weight}</span>`+
      `<button data-act="inc" data-i="${idx}">+</button>`+
      `<button class="del" data-act="del" data-i="${idx}">删除</button></span>`;
    el.appendChild(div);
  });
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = +b.dataset.i, act = b.dataset.act;
      if(act==='inc') data[cur2].items[i].weight = Math.min(5, data[cur2].items[i].weight+1);
      else if(act==='dec') data[cur2].items[i].weight = Math.max(1, data[cur2].items[i].weight-1);
      else if(act==='del') data[cur2].items.splice(i,1);
      save(data); renderManage();
    });
  });
}
document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newName').value.trim();
  const w = +document.getElementById('newWeight').value;
  if(!name) return;
  const exist = data[cur2].items.find(x=>x.text===name);
  if(exist) exist.weight = w; else data[cur2].items.push({ text:name, weight:w });
  document.getElementById('newName').value = '';
  save(data); renderManage();
});
</script>
</body>
</html>
